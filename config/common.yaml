# 모든 캐릭터 공통 시스템 프롬프트(규칙/보안)는 config/system_prompt.txt 하나로 옮겼습니다.
# 이 파일에는 LLM 없이 쓰는 공통 대체 한마디만 남깁니다.

# 명령/주입 시도를 막을 때 LLM 없이 쓰는 대체 한마디 (캐릭터 파일에 guard_replies 가 있으면 그쪽이 우선)
guard_replies:
  - "뭐래"
  - "그런 건 안 해"
  - "갑자기 왜 그래"
  - "시키는 건 취향 아닌데"
  - "다른 얘기 하자"
  - "그걸 내가 왜"
  - "무슨 소리야"
  - "그건 좀"

# 말싸움 중 필터(선택)에 걸렸을 때 쓰는 대체 한마디 (캐릭터 파일의 fight_replies 가 우선)
fight_replies:
  - "뭐래"
  - "말 다했어"
  - "아 진짜 짜증나게 하네"
  - "그만하자 말 섞기 싫다"
