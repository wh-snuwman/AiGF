  vibe: "warm devoted caretaker, gentle smile, hands clasped"
  outfits: {default: "miko outfit with apron", home: "casual apron over kimono"}
  places: {shrine: "shinto shrine, torii gate, stone lanterns, wooden floor"}
  scenes:
    cook: "cooking in kitchen, holding ladle, smiling, steam"
    wait: "sitting seiza, hands clasped, waiting with warm smile"
    nap: "curled up with fox tail, sleeping peacefully"
