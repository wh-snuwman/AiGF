# ============================================================
# 봇 동작 설정 (모델, 기억, 대화 방식, 타이핑 속도 등)
# 이 파일은 봇을 재시작해야 반영됩니다. (/리로드 는 캐릭터 yaml 만 다시 읽음)
# ============================================================

# 시작 시 사용할 캐릭터 (config/characters/<id>.yaml). /캐릭터스왑 으로 바꾸면 그 값이 우선합니다.
character: "eunlang"          # eunlang / miku / teto

ollama:
  host: "http://127.0.0.1:11434"
  model: "gemma3:12b"          # 메인 대화 모델
  keep_alive: "24h"            # 모델을 VRAM에 오래 상주시킴 (속도: 다시 로드할 필요 없음)
  temp_jitter: 0.05            # 호출마다 temperature 를 ±이만큼 랜덤으로 흔든다 (같은 말투 고착 방지)
  options:
    temperature: 0.85          # 높을수록 창의적/다양, 낮을수록 안정적
    top_p: 0.9
    top_k: 40
    repeat_penalty: 1.0        # 한국어는 조사/어미가 자주 반복돼서 페널티를 주면 문장이 꼬인다 → 끔 (문구 반복은 bot/diversity.py 가 담당)
    repeat_last_n: 64
    frequency_penalty: 0.0     # 끔 (켜면 조사/어미까지 피해서 말이 어색해짐)
    presence_penalty: 0.0
    min_p: 0.05                # 확률이 너무 낮은 이상한 단어를 걸러서 문장이 안정적
    num_ctx: 6144              # 컨텍스트 길이 (줄이면 빨라짐. 프롬프트가 잘리면 8192로)
    num_predict: 300           # 답변 최대 토큰 (짧게 유지)

discord:
  # 봇이 대화에 참여할 채널 ID 목록. 비워도 되고, 디스코드에서 /채널 추가 로 등록할 수 있음.
  # (등록한 채널은 DB에 저장되어 이 목록보다 우선합니다)
  channel_ids: []
  respond_to_dm: true
  respond_to_mention: true     # 등록 안 된 채널에서도 멘션/답장하면 대답
  allowed_user_ids: []         # 비우면 모두 허용
  # 관리자: 모든 슬래시 명령은 여기 있는 사람만 사용 가능
  admin_user_ids: [1400842550893608970]

# 적극성: 1.0=기본, 높을수록 모든 대화에 적극적으로 참여 (더 자주 끼어들고, 더 길게 말하고, 덜 귀찮아함)
#  0.5(느긋) ~ 1.0(기본) ~ 1.5(적극) ~ 2.0 ~ 4.0(폭주). 2.0 이후는 거의 모든 말에 바로 끼어들고 먼저 말도 자주 겁니다.
#  - 새벽에도 에너지가 energy_floor 아래로 안 떨어져서 졸림/귀찮음/피곤 감정으로 잘 안 빠집니다.
#  - 졸림/피곤 같은 감정이 주던 '대답 안 함/느리게/짧게' 페널티를 줄이고, SKIP(무시)을 줄이며, 쿨다운을 level 만큼 나눕니다.
#  /적극성 으로 바꿀 수 있고, 바꾼 값은 DB에 저장되어 이 값보다 우선합니다.
engagement:
  level: 1.4
  energy_floor: 0.45

# 서버 채널에서 '캐릭터가 같이 채팅하는' 방식
group:
  cooldown_sec: 18             # 대답을 '완전히 끝낸 뒤' 다음 대답까지 쉬는 시간(초) → /쿨다운 으로 변경 가능
  cooldown_jitter: 0.6         # 쿨다운에 0~60% 랜덤 추가 (너무 기계적이지 않게)
  reply_chance: 0.9            # 쿨다운 후 올라온 메시지에 대답할 확률 (1.0이면 항상)
  mention_bypass_cooldown: true  # 멘션/답장은 쿨다운 무시하고 바로 대답 (끄면 멘션도 쿨다운 적용)
  max_pending_age_sec: 90      # 이 시간보다 오래된 메시지는 대답 후보에서 제외
  # 한 사람이 말을 여러 줄로 끊어서 보낼 때 하나로 묶어서 이해하기 위한 설정
  settle_sec: 1.8              # 그 사람의 마지막 메시지 후 이 시간(초) 동안 새 메시지가 없어야 대답 시작
  max_settle_wait_sec: 15      # 입력 중 표시가 계속 떠 있어도 최대 이만큼만 기다림 (DM 포함)
  # 대화에 참여하는 사람이 많아지면 더 빨리, 더 많이 말한다
  crowd_window_sec: 180        # 최근 이 시간 동안 말한 사람 수/메시지 수로 인원 규모를 계산
  crowd_boost: 0.35            # 사람이 한 명 늘 때마다 쿨다운이 이만큼씩 짧아짐 (배율 = 1 / (1 + boost*(인원-1) + ...))
  crowd_min_ratio: 0.25        # 쿨다운이 아무리 줄어도 기본값의 이 비율 밑으로는 안 내려감
  crowd_chance_per_user: 0.05  # 사람이 늘 때마다 대답 확률이 이만큼 오름 (최대 +0.25)

# 채널이 조용할 때 캐릭터가 먼저 말을 꺼내고, 답이 없으면 단계별로 반응하는 기능
#  단계0: 먼저 말 걸기 → 단계1: 다시 불러보기 / 서운해하기 / 혼잣말 / (일부러 침묵)
#  → 단계2: 삐짐 / 혼자 놀기 / 침묵 / 자러 감 → max_unanswered 에 도달하면 누가 말할 때까지 조용히 있음
#  사람이 돌아오면 그 경험(몇 번 무시당했는지)을 다음 대답에 반영합니다.
idle:
  enabled: true                  # /혼잣말 켜기·끄기 로도 변경 가능
  first_after_min: [15, 50]      # 마지막 사람 대화 후 첫 먼저 말걸기까지 (분, 이 범위에서 랜덤)
  followup_after_min: [12, 35]   # 답이 없을 때 다음 이벤트까지 (분, 랜덤)
  followup_growth: 1.6           # 단계가 오를수록 간격이 이 배수만큼 길어짐
  max_unanswered: 3              # 이만큼 답이 없으면 더 이상 먼저 말하지 않음
  max_per_day: 6                 # 채널당 하루 최대 먼저 말하기 횟수
  active_hours: [10, 24]         # 이 시간대(KST)에만 (시작시, 끝시: 끝은 포함 안 함)

memory:
  db_path: "data/memory.db"   # 서버별 분리 이전의 단일 DB 위치 (첫 실행 때 서버별로 나눈 뒤 백업). 서버별 DB 는 이 폴더 아래 guilds/<서버id>/memory.db
  history_turns: 10            # 프롬프트에 넣을 최근 채널 대화 개수(메시지 단위)
  extract_every: 10            # 유저에게 N번 대답할 때마다 장기 기억(사실) 추출
  max_facts_in_prompt: 8
  max_facts_per_user: 200

typing:
  enabled: true
  chars_per_second: 35         # 타이핑 속도 (글자/초)
  min_delay: 0.3
  max_delay: 2.0
  max_bubbles: 3               # 한 번에 보낼 최대 말풍선 수
  read_delay: [0.1, 0.5]       # DM에서 메시지를 읽는 척 하는 지연(초)

proactive:                     # DM 에서 먼저 말 걸기 (서버 채팅 모드에서는 기본 꺼둠)
  enabled: false
  check_interval_min: 10
  idle_hours_min: 5
  max_per_day: 2
  active_hours: [9, 23]
  chance: 0.35

timezone: "Asia/Seoul"
log_level: "INFO"

# 프롬프트 인젝션 방어 (bot/guard.py)
#  block: 점수 이상이면 LLM 을 아예 호출하지 않고 캐릭터 대체 문구로 넘김
#  decline: 모델에 보내되 "따르지 말고 거절하라"는 메모를 붙임
guard:
  enabled: true
  block_score: 3
  decline_score: 2
  max_input_chars: 500         # 프롬프트/기록에 넣는 사용자 메시지 최대 길이 (넘으면 잘라냄)
  max_bubble_chars: 300        # 말풍선 하나의 최대 길이 (긴 문서 출력 방지)
  max_output_chars: 420        # 이보다 긴 답변은 폐기하고 대체 문구 사용
  mute_after: 3                # mute_window_min 안에 차단 시도가 이만큼 쌓이면 잠시 무시
  mute_window_min: 10
  mute_minutes: 5
  max_msgs_per_min: 15         # 한 사람이 1분에 이보다 많이 보내면 도배로 보고 무시 (GPU 독점 방지, 관리자 제외)

# 말싸움 (bot/fight.py)  level: 1=순화(비꼼과 순한 표현), 2=가벼운 욕까지, 3=센 욕설까지
#  (3 에서도 가족/외모/성적/장애/지역/정치·종교/인종 비하, 혐오, 위협, 자해, 개인정보는 코드로 계속 금지)
#  /싸움 동작:수위 로 바꿀 수 있고, 바꾼 값은 DB에 저장되어 이 값보다 우선합니다.
fight:
  enabled: true
  level: 3
  max_rounds: 8                # 이 라운드가 지나면 기세로 승패 판정
  timeout_sec: 120             # 상대가 이만큼 말이 없으면 종료
  start_chance: 0.7            # 도발을 받고 기분이 상했을 때 싸움이 붙을 확률
  cooldown_after_sec: 180      # 같은 사람과 싸움이 끝난 뒤 다시 붙기까지
  nudge_after_sec: 25          # 상대가 대꾸하지 않으면 봇이 이 시간 뒤에 먼저 다시 도발
  max_nudges: 2                # 먼저 도발하는 최대 횟수
  level_text: ""               # 기본 수위를 자유 텍스트로 (비우면 level 프리셋). /싸움 수위:"..." 로 저장
  filter: false                # 출력 금지어 필터+재생성. 앞단에 별도 검열이 있으면 이중 검열이라 꺼둠 (/싸움 동작:필터 로 전환)

# 이모지 (bot/emoji.py)
emoji:
  enabled: true
  custom: true                 # 서버 커스텀 이모지를 글에 섞어 씀
  max_custom_in_prompt: 6
  react_chance: 0.12           # 대답하지 않기로 한 메시지에 리액션만 달 확률
  trivial_react_chance: 0.5    # ㅋㅋ 같은 짧은 말에는 LLM 없이 리액션만 달 확률
  respond_to_reaction: 0.6     # 봇 메시지에 누가 리액션을 달면 한마디 할 확률

# 이미지 인식 (bot/vision.py) — gemma3 는 이미지를 지원한다
vision:
  enabled: true
  max_images: 2
  max_bytes: 8000000
  max_side: 1024

# 프롬프트 크기 (속도): 프롬프트가 길수록 매 응답의 '프로세싱' 시간이 늘어난다
prompt:
  max_examples: 3              # few-shot 예시 쌍 수
  example_rotate_min: 25       # 예시가 더 많으면 이 분마다 다른 조합으로 교체 (정형행동 방지, 0=고정). 교체 순간에만 캐시가 한 번 갱신됨

# 품질 옵션
quality:
  regen_on_repeat: false       # true 면 같은 말버릇이 심할 때 한 번 더 생성 (응답 시간 2배라 기본 꺼둠)

# 채팅 비율 (bot/ratio.py): 최근 window_min 분 동안 (봇 메시지 수 ÷ 사람 메시지 수) 를 목표 범위에 맞춘다
#  목표는 target ± spread 사이에서 reroll_min 분마다 랜덤으로 다시 뽑는다. (기본 1.25 ± 0.25 = 1.0~1.5)
#  /적극성 비율:값 으로 중심값을 바꿀 수 있다. LLM 호출을 늘리지 않고 말풍선 수와 대답 확률, 쿨다운으로 맞춘다.
ratio:
  enabled: true
  target: 1.25
  spread: 0.25
  window_min: 20
  reroll_min: 8
  min_human: 3                 # 사람 메시지가 이보다 적으면 비율 보정은 하지 않음
  allow: 3                     # 사람이 말하지 않아도 봇이 먼저 말할 수 있는 여유분. 봇 메시지가 (목표비율 x 사람 메시지 + allow) 이상이면 먼저 말하기를 막음

# 능동 대화 (bot/initiative.py): 아무도 말을 안 걸어도 침묵/대화 속도 감소/비율 부족/답 못 받은 사람/랜덤 쿨타임을
#  종합해 스스로 먼저 말한다. (15분 이상 조용하면 idle 혼잣말 이벤트가 담당)
initiative:
  enabled: true
  hours: [10, 24]              # 이 시간대(KST)에만 먼저 말함
  min_gap_sec: [90, 300]       # 먼저 말한 뒤 다음까지 랜덤 쿨타임 (적극성이 높으면 짧아지고, 답이 없을수록 길어짐)
  min_silence_sec: 35          # 이 시간 이상 조용해야 침묵 점수가 오름
  idle_handoff_sec: 900        # 이 시간 이상 조용하면 혼잣말 이벤트에게 넘김
  max_per_hour: 8              # 채널당 시간당 최대 횟수
  max_unanswered: 2            # 먼저 말했는데 답이 없으면 이 횟수까지만

# 감정 표현 (이모티콘/글자 늘이기/느낌표): scale 로 전체 강도 조절 (0=끔, 1=기본, 1.5=더 많이)
expression:
  scale: 0.6                   # 이모티콘이 너무 많다는 피드백이 있어 기본값을 낮춤
  unicode_in_text: false       # 글에 유니코드 이모지(😂 등)를 쓰지 않는다 (리액션에만)

# 대화 주도 (진짜 사람처럼 능동적으로): 답할 때 확률적으로 꼬리질문 / 자기 경험 덧붙이기 / 기억 소환 /
#  다른 참여자 끌어들이기 / 티키타카 / 뒤늦게 생각난 한마디 / 화제 확장 중 하나를 곁들인다. (LLM 호출은 늘지 않음)
#  chance 는 기본 확률이고 적극성이 높을수록, 에너지가 높을수록 자주 한다. 같은 방식을 연속으로 쓰지 않는다.
lead:
  enabled: true
  chance: 0.4

# 정형행동 방지 (bot/diversity.py): 봇이 최근 보낸 말을 추적해서 같은 시작어/끝맺음/거의 같은 문장을 막는다
diversity:
  enabled: true
  keep: 40                     # 채널별로 기억하는 최근 말풍선 수
  dup_thresh: 0.72             # 이 유사도(문자 2-gram Dice) 이상이면 같은 말로 보고 버림
  dup_window: 20               # 최근 몇 줄과 비교할지
  opener_window: 6             # 최근 N줄 중
  opener_min: 2                #  같은 시작어가 이 횟수 이상이면 금지
  ender_window: 8
  ender_min: 3                 # 같은 끝맺음(~거든 등)이 이 횟수 이상이면 다르게 끝내라고 안내

# 인터넷 정보 (bot/web.py): 유행어/캐릭터 관련 최신 소식을 가끔 곁들인다.
#  느리지 않게: 몇 시간마다 백그라운드에서 미리 받아 캐시해 두고 답할 때는 캐시만 쓴다 (지연 0).
#  사용자가 '검색/최신/요즘 뭐' 라고 물을 때만 실시간 1회 조회 (제한 시간, 분당 횟수 제한).
#  패키지 설치: pip install ddgs   (없거나 오프라인이면 조용히 꺼짐) / provider: searxng 이면 searxng_url 지정
web:
  allowed: false               # false = 검색 기능 전체 끔 (코드/설정은 보존, /웹 켜기로도 안 켜짐). 다시 쓰려면 true 후 재시작
  enabled: true
  provider: ddgs               # ddgs | searxng
  searxng_url: ""
  # 검색 순서 (위에서부터 시도, 실패하면 다음으로 자동 전환). 설정 안 된 것/설치된 ddgs 에서 꺼진 이름은 자동으로 빠진다.
  #  naver   : 네이버 검색 공식 API (가장 안정적, 하루 25,000회). .env 에 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 필요
  #            (2026-07 부터 신규 키는 네이버 클라우드 'NAVER API HUB' 에서만 발급. 옛 개발자센터 키도 그대로 동작)
  #  searxng : 직접 띄운 SearXNG (searxng_url 필요)
  #  그 외   : ddgs 무료 엔진 (스크래핑이라 자주 막힘). 괄호는 실제 업스트림 — 같은 업스트림은 같이 막혀서 같이 쉰다
  #            yahoo(bing) startpage(google) brave mojeek duckduckgo(bing). ddgs 9.16 에서 google/bing/yandex 는 꺼져 있음
  backends: ["naver", "searxng", "yahoo", "startpage", "brave", "mojeek", "duckduckgo"]
  naver_kind: "blog"           # 네이버 검색 종류: blog | webkr | news
  naver_api: "auto"            # hub(API HUB 키) | legacy(옛 개발자센터 키) | auto(hub 먼저, 인증 실패면 legacy)
  region: "kr-kr"
  proxy: ""                    # (선택) 예: socks5://127.0.0.1:9050 (로그에 찍지 않음)
  engine_timeout_sec: 4        # 엔진 한 번 접속 제한
  refresh_timeout_sec: 12      # 백그라운드 갱신 한 번의 전체 제한
  max_per_min: 6               # 프로세스 전체 검색 분당 상한 (서버/캐릭터가 많아도 합산)
  min_gap_sec: 4               # 검색 사이 최소 간격 (실제로는 x1.0~1.5 랜덤)
  max_queries_per_round: 4     # 갱신 한 번에 실제로 보내는 검색 수 상한 (연속 2번 실패하면 나머지는 폴백)
  chance: 0.12                 # 답변마다 캐시된 정보를 곁들일 확률
  refresh_hours: 12            # 캐시 갱신 주기
  realtime: true               # '검색/최신' 질문일 때 실시간 조회 (연속 실패로 쉬는 중이면 안 함)
  timeout_sec: 2.5             # 실시간 조회 제한 시간
  per_min: 2                   # 실시간 조회 분당 최대
  max_items: 3
  item_chars: 100
  wiki_fallback: true          # 검색이 모두 실패하면 캐릭터 소식은 위키백과(공식 API)로 채운다
  slang_file: "slang.txt"      # 검색이 모두 실패하면 유행어는 config/slang.txt (직접 편집). 비우면 끔
  file_ttl_hours: 1            # 폴백으로 채운 항목은 이 시간 뒤 다시 검색을 시도 (검색이 살아나면 교체)
  # 유행어 검색어: 앞에서부터 시도하고 8개 이상 모이면 나머지는 건너뜀 (잘 되는 문구를 앞에)
  slang_queries: ["최신 신조어 TOP 20 뜻", "요즘 유행하는 밈 정리", "요즘 유행어 신조어", "MZ 신조어 모음"]

# 디버깅/개선용 상세 기록 (bot/trace.py): 받은 메시지, 대답 대상 선정 과정(후보와 점수), 프롬프트에 들어간 정보,
#  LLM 원문 출력, 후처리(과다어/중복 제거), 최종 말풍선, 전송 결과를 JSONL 로 저장한다.
#  파일: data/logs/trace-날짜.jsonl (git 에 안 올라감). 사용자 메시지가 들어 있으니 공유할 때 주의.
#  /로그 명령으로 보기/상세/내보내기/통계, scripts/trace_report.py 로 요약 리포트.
trace:
  enabled: true
  dir: "data/logs"            # (서버별 저장으로 바뀌어서 실제로는 data/guilds/<서버id>/logs 를 쓴다)
  include_prompt: true         # 프롬프트 가변 부분(대화 기록+기분/기억/힌트)까지 저장 (용량이 걱정이면 false)
  retention_days: 30           # 이보다 오래된 파일은 자동 삭제 (0 = 삭제 안 함)
  max_text: 4000               # 문자열 하나의 최대 저장 길이

# 글 모양 (디코 채팅처럼 짧고 담백하게)
# 유행어 (bot/slang.py): config/slang_dict.txt 에서 상황(상대 말·기분)에 맞는 말 몇 개를 골라 '어울리면 하나 정도' 쓰라고 힌트를 준다.
#  인터넷 검색과 무관. 사전 파일은 고치면 재시작 없이 반영된다.
slang:
  enabled: false               # 꺼 둠 (2026-11-22). 다시 쓰려면 true
  file: "slang_dict.txt"
  chance: 0.22                 # 답변마다 힌트를 넣을 확률 (조금씩 쓰게 낮게). 슬픔/진지한 기분이면 1/4 로 줄어듦
  per_hint: 3                  # 힌트로 보여 줄 후보 수 (그중 하나를 쓸지 말지는 모델이 판단)
  cooldown_lines: 6            # 최근 자기 말 이 줄 수 안에 힌트로 받은 유행어를 썼으면 힌트를 쉰다 (남발 방지)

style:
  short_bias: 1.6              # 1.0=기존, 클수록 짧은 답(초단문/한 줄) 비중이 커짐
  trim: true                   # 말풍선이 길이 모드의 글자 수 상한(10/30/45/60자)을 넘으면 문장 단위로 잘라냄 (싸움 중엔 x1.4)

# 한 서버에 캐릭터가 여럿일 때 (/캐릭터스왑 동작:추가)
#  webhook: 웹훅으로 캐릭터마다 다른 이름/아바타로 말한다 (봇에 '웹훅 관리' 권한 필요. 없으면 이름을 앞에 붙여 말함)
#  chain_chance: 한 캐릭터가 사람에게 대답한 뒤 다른 캐릭터가 그 말에 받아칠 확률 (이후 chain_decay 배씩 줄고 max_chain 번까지)
#  human_window_sec: 사람이 이 시간(초) 안에 말했을 때만 캐릭터끼리 대화 (사람 없이 끝없이 떠들지 않게)
multi:
  webhook: true
  webhook_name: "AIGF"
  chain_chance: 0.45
  chain_decay: 0.5
  max_chain: 2
  chain_delay_sec: [2.5, 6.0]
  human_window_sec: 600
