# ============================================================
# 봇 동작 설정 (모델, 기억, 말하는 속도, 먼저 말걸기 등)
# ============================================================

ollama:
  host: "http://127.0.0.1:11434"
  model: "gemma3:12b"          # 메인 대화 모델 (아래 README의 모델 추천 참고)
  keep_alive: "30m"            # 모델을 VRAM에 유지하는 시간
  options:
    temperature: 0.9           # 높을수록 창의적/다양, 낮을수록 안정적
    top_p: 0.95
    top_k: 64
    repeat_penalty: 1.1        # 같은 말 반복 방지
    num_ctx: 8192              # 컨텍스트 길이 (12GB VRAM이면 8192 권장)
    num_predict: 300           # 답변 최대 토큰 (짧게 유지)

discord:
  # 봇이 자동으로 대답할 채널 ID 목록 (비우면 DM과 멘션에만 반응)
  channel_ids: []
  respond_to_dm: true
  respond_to_mention: true
  # 특정 유저만 허용하려면 ID 입력 (비우면 모두 허용)
  allowed_user_ids: []
  # 관리자 (리로드/초기화 등 관리 명령 가능)
  admin_user_ids: []

memory:
  db_path: "data/memory.db"
  history_turns: 16            # 프롬프트에 넣을 최근 대화 개수(메시지 단위)
  extract_every: 10            # 유저 메시지 N개마다 장기 기억(사실) 추출
  max_facts_in_prompt: 25      # 프롬프트에 넣을 장기 기억 최대 개수
  max_facts_per_user: 200

typing:
  enabled: true
  chars_per_second: 14         # 타이핑 속도 (글자/초). 클수록 빠름
  min_delay: 0.8               # 말풍선당 최소 딜레이(초)
  max_delay: 5.0
  max_bubbles: 3               # 한 번에 보낼 최대 말풍선 수
  read_delay: [0.5, 2.0]       # 메시지를 읽는 척 하는 지연(초) 범위

proactive:                     # 캐릭터가 먼저 말 걸기
  enabled: true
  check_interval_min: 10       # 몇 분마다 검사할지
  idle_hours_min: 5            # 마지막 대화 후 최소 이 시간 지나야 먼저 연락
  max_per_day: 2               # 유저당 하루 최대 횟수
  active_hours: [9, 23]        # 이 시간대(KST)에만 연락
  dm_only: true                # DM으로만 먼저 연락
  chance: 0.35                 # 검사 시점마다 연락할 확률 (너무 기계적이지 않게)

timezone: "Asia/Seoul"
log_level: "INFO"
