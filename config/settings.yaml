# ============================================================
# 봇 동작 설정 (모델, 기억, 대화 방식, 타이핑 속도 등)
# 이 파일은 봇을 재시작해야 반영됩니다. (/리로드 는 캐릭터 yaml 만 다시 읽음)
# ============================================================

# 시작 시 사용할 캐릭터 (config/characters/<id>.yaml). /캐릭터스왑 으로 바꾸면 그 값이 우선합니다.
character: "eunlang"          # eunlang / miku / teto

ollama:
  host: "http://127.0.0.1:11434"
  model: "gemma3:12b"          # 메인 대화 모델
  keep_alive: "24h"            # 모델을 VRAM에 오래 상주시킴 (속도: 다시 로드할 필요 없음)
  options:
    temperature: 1.0           # 높을수록 창의적/다양, 낮을수록 안정적
    top_p: 0.95
    top_k: 64
    repeat_penalty: 1.15       # 같은 말 반복 방지
    repeat_last_n: 256         # 반복을 감시할 최근 토큰 범위 (기본 64 → 넓혀서 말버릇 반복 억제)
    presence_penalty: 0.2      # 이미 쓴 단어를 다시 쓰는 것에 약한 페널티 (지원 안 하는 버전이면 무시됨)
    num_ctx: 6144              # 컨텍스트 길이 (줄이면 빨라짐. 프롬프트가 잘리면 8192로)
    num_predict: 300           # 답변 최대 토큰 (짧게 유지)

discord:
  # 봇이 대화에 참여할 채널 ID 목록. 비워도 되고, 디스코드에서 /채널 추가 로 등록할 수 있음.
  # (등록한 채널은 DB에 저장되어 이 목록보다 우선합니다)
  channel_ids: []
  respond_to_dm: true
  respond_to_mention: true     # 등록 안 된 채널에서도 멘션/답장하면 대답
  allowed_user_ids: []         # 비우면 모두 허용
  # 관리자: 모든 슬래시 명령은 여기 있는 사람만 사용 가능
  admin_user_ids: [1400842550893608970]

# 적극성: 1.0=기본, 높을수록 모든 대화에 적극적으로 참여 (더 자주 끼어들고, 더 길게 말하고, 덜 귀찮아함)
#  0.5(느긋) ~ 1.0(기본) ~ 1.5(적극) ~ 2.0 ~ 4.0(폭주). 2.0 이후는 거의 모든 말에 바로 끼어들고 먼저 말도 자주 겁니다.
#  - 새벽에도 에너지가 energy_floor 아래로 안 떨어져서 졸림/귀찮음/피곤 감정으로 잘 안 빠집니다.
#  - 졸림/피곤 같은 감정이 주던 '대답 안 함/느리게/짧게' 페널티를 줄이고, SKIP(무시)을 줄이며, 쿨다운을 level 만큼 나눕니다.
#  /적극성 으로 바꿀 수 있고, 바꾼 값은 DB에 저장되어 이 값보다 우선합니다.
engagement:
  level: 1.4
  energy_floor: 0.45

# 서버 채널에서 '캐릭터가 같이 채팅하는' 방식
group:
  cooldown_sec: 18             # 대답을 '완전히 끝낸 뒤' 다음 대답까지 쉬는 시간(초) → /쿨다운 으로 변경 가능
  cooldown_jitter: 0.6         # 쿨다운에 0~60% 랜덤 추가 (너무 기계적이지 않게)
  reply_chance: 0.9            # 쿨다운 후 올라온 메시지에 대답할 확률 (1.0이면 항상)
  mention_bypass_cooldown: true  # 멘션/답장은 쿨다운 무시하고 바로 대답 (끄면 멘션도 쿨다운 적용)
  max_pending_age_sec: 90      # 이 시간보다 오래된 메시지는 대답 후보에서 제외
  # 한 사람이 말을 여러 줄로 끊어서 보낼 때 하나로 묶어서 이해하기 위한 설정
  settle_sec: 1.8              # 그 사람의 마지막 메시지 후 이 시간(초) 동안 새 메시지가 없어야 대답 시작
  max_settle_wait_sec: 15      # 입력 중 표시가 계속 떠 있어도 최대 이만큼만 기다림 (DM 포함)
  # 대화에 참여하는 사람이 많아지면 더 빨리, 더 많이 말한다
  crowd_window_sec: 180        # 최근 이 시간 동안 말한 사람 수/메시지 수로 인원 규모를 계산
  crowd_boost: 0.35            # 사람이 한 명 늘 때마다 쿨다운이 이만큼씩 짧아짐 (배율 = 1 / (1 + boost*(인원-1) + ...))
  crowd_min_ratio: 0.25        # 쿨다운이 아무리 줄어도 기본값의 이 비율 밑으로는 안 내려감
  crowd_chance_per_user: 0.05  # 사람이 늘 때마다 대답 확률이 이만큼 오름 (최대 +0.25)

# 채널이 조용할 때 캐릭터가 먼저 말을 꺼내고, 답이 없으면 단계별로 반응하는 기능
#  단계0: 먼저 말 걸기 → 단계1: 다시 불러보기 / 서운해하기 / 혼잣말 / (일부러 침묵)
#  → 단계2: 삐짐 / 혼자 놀기 / 침묵 / 자러 감 → max_unanswered 에 도달하면 누가 말할 때까지 조용히 있음
#  사람이 돌아오면 그 경험(몇 번 무시당했는지)을 다음 대답에 반영합니다.
idle:
  enabled: true                  # /혼잣말 켜기·끄기 로도 변경 가능
  first_after_min: [15, 50]      # 마지막 사람 대화 후 첫 먼저 말걸기까지 (분, 이 범위에서 랜덤)
  followup_after_min: [12, 35]   # 답이 없을 때 다음 이벤트까지 (분, 랜덤)
  followup_growth: 1.6           # 단계가 오를수록 간격이 이 배수만큼 길어짐
  max_unanswered: 3              # 이만큼 답이 없으면 더 이상 먼저 말하지 않음
  max_per_day: 6                 # 채널당 하루 최대 먼저 말하기 횟수
  active_hours: [10, 24]         # 이 시간대(KST)에만 (시작시, 끝시: 끝은 포함 안 함)

memory:
  db_path: "data/memory.db"
  history_turns: 10            # 프롬프트에 넣을 최근 채널 대화 개수(메시지 단위)
  extract_every: 10            # 유저에게 N번 대답할 때마다 장기 기억(사실) 추출
  max_facts_in_prompt: 8
  max_facts_per_user: 200

typing:
  enabled: true
  chars_per_second: 35         # 타이핑 속도 (글자/초)
  min_delay: 0.3
  max_delay: 2.0
  max_bubbles: 3               # 한 번에 보낼 최대 말풍선 수
  read_delay: [0.1, 0.5]       # DM에서 메시지를 읽는 척 하는 지연(초)

proactive:                     # DM 에서 먼저 말 걸기 (서버 채팅 모드에서는 기본 꺼둠)
  enabled: false
  check_interval_min: 10
  idle_hours_min: 5
  max_per_day: 2
  active_hours: [9, 23]
  chance: 0.35

timezone: "Asia/Seoul"
log_level: "INFO"

# 프롬프트 인젝션 방어 (bot/guard.py)
#  block: 점수 이상이면 LLM 을 아예 호출하지 않고 캐릭터 대체 문구로 넘김
#  decline: 모델에 보내되 "따르지 말고 거절하라"는 메모를 붙임
guard:
  enabled: true
  block_score: 3
  decline_score: 2
  max_input_chars: 500         # 프롬프트/기록에 넣는 사용자 메시지 최대 길이 (넘으면 잘라냄)
  max_bubble_chars: 300        # 말풍선 하나의 최대 길이 (긴 문서 출력 방지)
  max_output_chars: 420        # 이보다 긴 답변은 폐기하고 대체 문구 사용
  mute_after: 3                # mute_window_min 안에 차단 시도가 이만큼 쌓이면 잠시 무시
  mute_window_min: 10
  mute_minutes: 5

# 말싸움 (bot/fight.py)  level: 1=순화(비꼼과 순한 표현), 2=가벼운 욕까지, 3=센 욕설까지
#  (3 에서도 가족/외모/성적/장애/지역/정치·종교/인종 비하, 혐오, 위협, 자해, 개인정보는 코드로 계속 금지)
#  /싸움 동작:수위 로 바꿀 수 있고, 바꾼 값은 DB에 저장되어 이 값보다 우선합니다.
fight:
  enabled: true
  level: 3
  max_rounds: 8                # 이 라운드가 지나면 기세로 승패 판정
  timeout_sec: 120             # 상대가 이만큼 말이 없으면 종료
  start_chance: 0.7            # 도발을 받고 기분이 상했을 때 싸움이 붙을 확률
  cooldown_after_sec: 180      # 같은 사람과 싸움이 끝난 뒤 다시 붙기까지
  nudge_after_sec: 25          # 상대가 대꾸하지 않으면 봇이 이 시간 뒤에 먼저 다시 도발
  max_nudges: 2                # 먼저 도발하는 최대 횟수
  level_text: ""               # 기본 수위를 자유 텍스트로 (비우면 level 프리셋). /싸움 수위:"..." 로 저장
  filter: false                # 출력 금지어 필터+재생성. 앞단에 별도 검열이 있으면 이중 검열이라 꺼둠 (/싸움 동작:필터 로 전환)

# 이모지 (bot/emoji.py)
emoji:
  enabled: true
  custom: true                 # 서버 커스텀 이모지를 글에 섞어 씀
  max_custom_in_prompt: 40
  react_chance: 0.12           # 대답하지 않기로 한 메시지에 리액션만 달 확률
  trivial_react_chance: 0.5    # ㅋㅋ 같은 짧은 말에는 LLM 없이 리액션만 달 확률
  respond_to_reaction: 0.6     # 봇 메시지에 누가 리액션을 달면 한마디 할 확률

# 이미지 인식 (bot/vision.py) — gemma3 는 이미지를 지원한다
vision:
  enabled: true
  max_images: 2
  max_bytes: 8000000
  max_side: 1024

# 프롬프트 크기 (속도): 프롬프트가 길수록 매 응답의 '프로세싱' 시간이 늘어난다
prompt:
  max_examples: 3              # few-shot 예시 쌍 수 (캐릭터 yaml 의 앞에서부터)

# 품질 옵션
quality:
  regen_on_repeat: false       # true 면 같은 말버릇이 심할 때 한 번 더 생성 (응답 시간 2배라 기본 꺼둠)

# 채팅 비율 (bot/ratio.py): 최근 window_min 분 동안 (봇 메시지 수 ÷ 사람 메시지 수) 를 목표 범위에 맞춘다
#  목표는 target ± spread 사이에서 reroll_min 분마다 랜덤으로 다시 뽑는다. (기본 1.25 ± 0.25 = 1.0~1.5)
#  /적극성 비율:값 으로 중심값을 바꿀 수 있다. LLM 호출을 늘리지 않고 말풍선 수와 대답 확률, 쿨다운으로 맞춘다.
ratio:
  enabled: true
  target: 1.25
  spread: 0.25
  window_min: 20
  reroll_min: 8
  min_human: 3                 # 사람 메시지가 이보다 적으면 비율 보정은 하지 않음
  allow: 2                     # 사람이 말하지 않아도 봇이 먼저 말할 수 있는 여유분. 봇 메시지가 (목표비율 x 사람 메시지 + allow) 이상이면 먼저 말하기를 막음

# 능동 대화 (bot/initiative.py): 아무도 말을 안 걸어도 침묵/대화 속도 감소/비율 부족/답 못 받은 사람/랜덤 쿨타임을
#  종합해 스스로 먼저 말한다. (15분 이상 조용하면 idle 혼잣말 이벤트가 담당)
initiative:
  enabled: true
  hours: [10, 24]              # 이 시간대(KST)에만 먼저 말함
  min_gap_sec: [120, 360]      # 먼저 말한 뒤 다음까지 랜덤 쿨타임 (적극성이 높으면 짧아지고, 답이 없을수록 길어짐)
  min_silence_sec: 35          # 이 시간 이상 조용해야 침묵 점수가 오름
  idle_handoff_sec: 900        # 이 시간 이상 조용하면 혼잣말 이벤트에게 넘김
  max_per_hour: 6              # 채널당 시간당 최대 횟수
  max_unanswered: 2            # 먼저 말했는데 답이 없으면 이 횟수까지만

# 감정 표현 (이모티콘/글자 늘이기/느낌표): scale 로 전체 강도 조절 (0=끔, 1=기본, 1.5=더 많이)
expression:
  scale: 0.6                   # 이모티콘이 너무 많다는 피드백이 있어 기본값을 낮춤
  unicode_in_text: false       # 글에 유니코드 이모지(😂 등)를 쓰지 않는다 (리액션에만)
