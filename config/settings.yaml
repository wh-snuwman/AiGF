# ============================================================
# 봇 동작 설정 (모델, 기억, 대화 방식, 타이핑 속도 등)
# 이 파일은 봇을 재시작해야 반영됩니다. (/리로드 는 캐릭터 yaml 만 다시 읽음)
# ============================================================

# 시작 시 사용할 캐릭터 (config/characters/<id>.yaml). /캐릭터스왑 으로 바꾸면 그 값이 우선합니다.
character: "eunlang"          # eunlang / miku / teto

ollama:
  host: "http://127.0.0.1:11434"
  model: "gemma3:12b"          # 메인 대화 모델
  keep_alive: "30m"            # 모델을 VRAM에 유지하는 시간
  options:
    temperature: 1.0           # 높을수록 창의적/다양, 낮을수록 안정적
    top_p: 0.95
    top_k: 64
    repeat_penalty: 1.15       # 같은 말 반복 방지
    repeat_last_n: 256         # 반복을 감시할 최근 토큰 범위 (기본 64 → 넓혀서 말버릇 반복 억제)
    presence_penalty: 0.2      # 이미 쓴 단어를 다시 쓰는 것에 약한 페널티 (지원 안 하는 버전이면 무시됨)
    num_ctx: 8192              # 컨텍스트 길이 (12GB VRAM이면 8192 권장)
    num_predict: 300           # 답변 최대 토큰 (짧게 유지)

discord:
  # 봇이 대화에 참여할 채널 ID 목록. 비워도 되고, 디스코드에서 /채널 추가 로 등록할 수 있음.
  # (등록한 채널은 DB에 저장되어 이 목록보다 우선합니다)
  channel_ids: []
  respond_to_dm: true
  respond_to_mention: true     # 등록 안 된 채널에서도 멘션/답장하면 대답
  allowed_user_ids: []         # 비우면 모두 허용
  # 관리자: 모든 슬래시 명령은 여기 있는 사람만 사용 가능
  admin_user_ids: [1400842550893608970]

# 서버 채널에서 '캐릭터가 같이 채팅하는' 방식
group:
  cooldown_sec: 25             # 대답을 '완전히 끝낸 뒤' 다음 대답까지 쉬는 시간(초) → /쿨다운 으로 변경 가능
  cooldown_jitter: 0.6         # 쿨다운에 0~60% 랜덤 추가 (너무 기계적이지 않게)
  reply_chance: 0.9            # 쿨다운 후 올라온 메시지에 대답할 확률 (1.0이면 항상)
  mention_bypass_cooldown: true  # 멘션/답장은 쿨다운 무시하고 바로 대답 (끄면 멘션도 쿨다운 적용)
  max_pending_age_sec: 300     # 이 시간보다 오래된 메시지는 대답 후보에서 제외
  # 한 사람이 말을 여러 줄로 끊어서 보낼 때 하나로 묶어서 이해하기 위한 설정
  settle_sec: 4                # 그 사람의 마지막 메시지 후 이 시간(초) 동안 새 메시지가 없어야 대답 시작
  max_settle_wait_sec: 20      # 입력 중 표시가 계속 떠 있어도 최대 이만큼만 기다림 (DM 포함)

# 채널이 조용할 때 캐릭터가 먼저 말을 꺼내고, 답이 없으면 단계별로 반응하는 기능
#  단계0: 먼저 말 걸기 → 단계1: 다시 불러보기 / 서운해하기 / 혼잣말 / (일부러 침묵)
#  → 단계2: 삐짐 / 혼자 놀기 / 침묵 / 자러 감 → max_unanswered 에 도달하면 누가 말할 때까지 조용히 있음
#  사람이 돌아오면 그 경험(몇 번 무시당했는지)을 다음 대답에 반영합니다.
idle:
  enabled: true                  # /혼잣말 켜기·끄기 로도 변경 가능
  first_after_min: [30, 90]      # 마지막 사람 대화 후 첫 먼저 말걸기까지 (분, 이 범위에서 랜덤)
  followup_after_min: [20, 50]   # 답이 없을 때 다음 이벤트까지 (분, 랜덤)
  followup_growth: 1.6           # 단계가 오를수록 간격이 이 배수만큼 길어짐
  max_unanswered: 3              # 이만큼 답이 없으면 더 이상 먼저 말하지 않음
  max_per_day: 6                 # 채널당 하루 최대 먼저 말하기 횟수
  active_hours: [10, 24]         # 이 시간대(KST)에만 (시작시, 끝시: 끝은 포함 안 함)

memory:
  db_path: "data/memory.db"
  history_turns: 20            # 프롬프트에 넣을 최근 채널 대화 개수(메시지 단위)
  extract_every: 10            # 유저에게 N번 대답할 때마다 장기 기억(사실) 추출
  max_facts_in_prompt: 25
  max_facts_per_user: 200

typing:
  enabled: true
  chars_per_second: 14         # 타이핑 속도 (글자/초)
  min_delay: 0.8
  max_delay: 5.0
  max_bubbles: 3               # 한 번에 보낼 최대 말풍선 수
  read_delay: [0.5, 2.0]       # DM에서 메시지를 읽는 척 하는 지연(초)

proactive:                     # DM 에서 먼저 말 걸기 (서버 채팅 모드에서는 기본 꺼둠)
  enabled: false
  check_interval_min: 10
  idle_hours_min: 5
  max_per_day: 2
  active_hours: [9, 23]
  chance: 0.35

timezone: "Asia/Seoul"
log_level: "INFO"

# 프롬프트 인젝션 방어 (bot/guard.py)
#  block: 점수 이상이면 LLM 을 아예 호출하지 않고 캐릭터 대체 문구로 넘김
#  decline: 모델에 보내되 "따르지 말고 거절하라"는 메모를 붙임
guard:
  enabled: true
  block_score: 3
  decline_score: 2
  max_input_chars: 500         # 프롬프트/기록에 넣는 사용자 메시지 최대 길이 (넘으면 잘라냄)
  max_bubble_chars: 300        # 말풍선 하나의 최대 길이 (긴 문서 출력 방지)
  max_output_chars: 420        # 이보다 긴 답변은 폐기하고 대체 문구 사용
  mute_after: 3                # mute_window_min 안에 차단 시도가 이만큼 쌓이면 잠시 무시
  mute_window_min: 10
  mute_minutes: 5
